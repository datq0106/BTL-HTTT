spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quan_ly_nha_tro?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quanlitro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Cấu hình riêng từng máy (Git bỏ qua); biến môi trường vẫn được ưu tiên.
spring.config.import=optional:classpath:application-local.properties
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Ảnh tin đăng/CCCD tối đa 5 MB (khớp FileUtils.TOI_DA_5MB); mặc định Spring chỉ 1 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
# Chạy sau Nginx/Caddy: nhận X-Forwarded-* để biết request gốc là HTTPS.
server.forward-headers-strategy=framework
server.port=${PORT:8080}
