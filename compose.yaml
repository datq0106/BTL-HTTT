# Chạy: docker compose up -d --build
# HTTPS có tên miền: đặt DOMAIN trong .env rồi docker compose --profile https up -d --build
# Xem docs/trien-khai-server.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    command:
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quan_ly_nha_tro
      MYSQL_USER: quanlitro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u quanlitro -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: ${DB_MEM_LIMIT:-1g}
    logging: *logging
    networks: [app]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/quan_ly_nha_tro?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: quanlitro
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      NHATRO_ADMIN_INITIAL_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      NHATRO_UPLOAD_DIR: /app/uploads
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    logging: *logging
    networks: [app]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [app]

  # Tùy chọn: HTTPS tự động (Let's Encrypt) khi có tên miền trỏ về server.
  caddy:
    image: caddy:2.8.4-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging
    networks: [app]

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  app:
